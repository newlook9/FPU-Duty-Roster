plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devnora.fpuroster'
    compileSdk 34

    defaultConfig {
        applicationId "com.devnora.fpuroster"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        fpu {
            storeFile file('fpu-release.keystore')
            storePassword 'fpuroster123'
            keyAlias 'fpukey'
            keyPassword 'fpuroster123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fpu
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fpu
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.13.1'
}
